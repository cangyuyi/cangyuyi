<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">王泽栋 · AI 产品经理</title>
  <desc id="desc">以需求、工作流、评测和人工兜底为主题的深色个人作品集横幅</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090B10"/>
      <stop offset="0.58" stop-color="#10121B"/>
      <stop offset="1" stop-color="#151329"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#8B9DFF"/>
    </linearGradient>
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mintGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#A3E635" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#A3E635" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#FFFFFF" opacity="0.045"/>
    </pattern>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="380" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="28" fill="url(#dots)"/>
  <circle cx="1050" cy="40" r="330" fill="url(#purpleGlow)"/>
  <circle cx="510" cy="400" r="260" fill="url(#mintGlow)"/>
  <rect x="1" y="1" width="1198" height="378" rx="27" fill="none" stroke="#FFFFFF" stroke-opacity="0.09"/>
  <rect x="64" y="54" width="34" height="3" rx="1.5" fill="url(#brand)"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="112" y="60" fill="#A7ACB9" font-size="13" font-weight="650" letter-spacing="2.5">PORTFOLIO / AI PRODUCT · 2026</text>
    <text x="62" y="151" fill="#F7F7F4" font-size="66" font-weight="760" letter-spacing="-1">王泽栋</text>
    <text x="286" y="149" fill="#777E90" font-size="18" font-weight="550" letter-spacing="2">WANG ZEDONG</text>
    <text x="64" y="202" fill="#B9A7F2" font-size="29" font-weight="650">AI 产品经理 · Agent 应用</text>
    <text x="64" y="251" fill="#D8DBE3" font-size="23" font-weight="450">让 AI 产品从「能演示」走到「可验证」。</text>
    <text x="64" y="284" fill="#858B99" font-size="15">AIGC 平台 / Agent 工作流 / AI 电商 · 杭州 · 2027 届</text>

    <g font-size="12" font-weight="650" letter-spacing="1.1">
      <rect x="64" y="316" width="142" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.09"/>
      <text x="135" y="336" text-anchor="middle" fill="#B9BECA">MAGO CO-FOUNDER</text>
      <rect x="218" y="316" width="136" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.09"/>
      <text x="286" y="336" text-anchor="middle" fill="#B9BECA">4 AI INTERNSHIPS</text>
      <rect x="366" y="316" width="158" height="30" rx="15" fill="#A3E635" fill-opacity="0.07" stroke="#A3E635" stroke-opacity="0.18"/>
      <text x="445" y="336" text-anchor="middle" fill="#C8EF8B">EVALUATION FIRST</text>
    </g>
  </g>

  <line x1="640" y1="58" x2="640" y2="324" stroke="#FFFFFF" stroke-opacity="0.075"/>

