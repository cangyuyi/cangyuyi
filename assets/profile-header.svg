    <rect x="692" y="60" width="444" height="132" rx="20" fill="#FFFFFF" fill-opacity="0.048" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="718" y="88" fill="#9298A8" font-size="11" font-weight="700" letter-spacing="1.8">AGENT WORKFLOW</text>
    <text x="1068" y="88" text-anchor="end" fill="#C4B5FD" font-size="11" font-weight="650">DESIGN → VERIFY</text>
    <path d="M 762 132 H 850 M 932 132 H 1020" stroke="#62697A" stroke-width="1.5"/>
    <path d="M 850 132 L 842 127 M 850 132 L 842 137 M 1020 132 L 1012 127 M 1020 132 L 1012 137" stroke="#62697A" stroke-width="1.5" fill="none"/>
    <rect x="718" y="108" width="88" height="48" rx="12" fill="#8B9DFF" fill-opacity="0.10" stroke="#8B9DFF" stroke-opacity="0.25"/>
    <circle cx="737" cy="132" r="5" fill="#8B9DFF"/>
    <text x="750" y="137" fill="#E3E7FF" font-size="13" font-weight="600">需求</text>
    <rect x="850" y="108" width="82" height="48" rx="12" fill="#C4B5FD" fill-opacity="0.09" stroke="#C4B5FD" stroke-opacity="0.22"/>
    <circle cx="869" cy="132" r="5" fill="#C4B5FD"/>
    <text x="882" y="137" fill="#EAE4FF" font-size="13" font-weight="600">编排</text>
    <rect x="1020" y="108" width="90" height="48" rx="12" fill="#A3E635" fill-opacity="0.08" stroke="#A3E635" stroke-opacity="0.23"/>
    <circle cx="1039" cy="132" r="5" fill="#A3E635"/>
    <text x="1052" y="137" fill="#E2F7C4" font-size="13" font-weight="600">验证</text>

    <rect x="692" y="208" width="258" height="116" rx="20" fill="#FFFFFF" fill-opacity="0.048" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="718" y="238" fill="#9298A8" font-size="11" font-weight="700" letter-spacing="1.8">EVALUATION</text>
    <text x="718" y="277" fill="#F2F3F6" font-size="22" font-weight="650">可追溯评测</text>
    <path d="M 724 301 H 936" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <rect x="866" y="250" width="10" height="43" rx="4" fill="#8B9DFF" opacity="0.42"/>
    <rect x="886" y="263" width="10" height="30" rx="4" fill="#8B9DFF" opacity="0.62"/>
    <rect x="906" y="242" width="10" height="51" rx="4" fill="#C4B5FD" opacity="0.82"/>
    <rect x="926" y="230" width="10" height="63" rx="4" fill="#A3E635" opacity="0.88"/>

    <rect x="966" y="208" width="170" height="116" rx="20" fill="#FFFFFF" fill-opacity="0.048" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="990" y="238" fill="#9298A8" font-size="11" font-weight="700" letter-spacing="1.8">HITL</text>
    <circle cx="1051" cy="275" r="25" fill="#A3E635" fill-opacity="0.08" stroke="#A3E635" stroke-opacity="0.22"/>
    <path d="M 1039 275 L 1048 284 L 1065 264" fill="none" stroke="#C8EF8B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1051" y="314" text-anchor="middle" fill="#B9BECA" font-size="11">人工确认兜底</text>
