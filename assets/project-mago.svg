<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">Mago AIGC Platform</title>
  <desc id="desc">Mago 项目封面，展示多节点 Agent 创意工作流</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10111C"/><stop offset="1" stop-color="#211947"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#9F7AEA" stop-opacity="0.34"/><stop offset="1" stop-color="#9F7AEA" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/></pattern>
  </defs>
  <rect width="720" height="280" rx="24" fill="url(#bg)"/>
  <rect width="720" height="280" rx="24" fill="url(#grid)"/>
  <circle cx="620" cy="40" r="230" fill="url(#glow)"/>
  <rect x="1" y="1" width="718" height="278" rx="23" fill="none" stroke="#FFFFFF" stroke-opacity="0.10"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="34" y="42" fill="#A7ACB9" font-size="12" font-weight="700" letter-spacing="2">01 / AIGC PLATFORM</text>
    <text x="32" y="105" fill="#F8F7FC" font-size="48" font-weight="750" letter-spacing="-1">Mago</text>
    <text x="34" y="137" fill="#C4B5FD" font-size="17" font-weight="550">AI 创意生产工作台</text>
    <text x="34" y="178" fill="#9298A8" font-size="13">从选题、脚本到分镜与提示词</text>
    <rect x="34" y="218" width="76" height="28" rx="14" fill="#8B9DFF" fill-opacity="0.10"/><text x="72" y="237" text-anchor="middle" fill="#C9D0FF" font-size="10" font-weight="700">21 NODES</text>
    <rect x="120" y="218" width="58" height="28" rx="14" fill="#C4B5FD" fill-opacity="0.10"/><text x="149" y="237" text-anchor="middle" fill="#DDD6FE" font-size="10" font-weight="700">HITL</text>
    <rect x="188" y="218" width="76" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.05"/><text x="226" y="237" text-anchor="middle" fill="#A7ACB9" font-size="10" font-weight="700">DEMO</text>
  </g>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <path d="M405 88H460M532 88H580M495 123V162M405 196H460M532 196H580" fill="none" stroke="#70668F" stroke-width="1.5"/>
    <circle cx="460" cy="88" r="3" fill="#8B9DFF"/><circle cx="580" cy="88" r="3" fill="#C4B5FD"/>
    <rect x="352" y="62" width="70" height="50" rx="12" fill="#FFFFFF" fill-opacity="0.055" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="387" y="92" text-anchor="middle" fill="#D8DBE3" font-size="12">选题</text>
    <rect x="460" y="52" width="72" height="70" rx="14" fill="#8B9DFF" fill-opacity="0.13" stroke="#8B9DFF" stroke-opacity="0.36"/>
    <circle cx="496" cy="78" r="8" fill="#8B9DFF"/><text x="496" y="105" text-anchor="middle" fill="#E4E7FF" font-size="12" font-weight="650">Agent</text>
    <rect x="580" y="62" width="82" height="50" rx="12" fill="#FFFFFF" fill-opacity="0.055" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="621" y="92" text-anchor="middle" fill="#D8DBE3" font-size="12">创意</text>
    <rect x="442" y="162" width="108" height="54" rx="14" fill="#C4B5FD" fill-opacity="0.10" stroke="#C4B5FD" stroke-opacity="0.28"/>
    <text x="496" y="194" text-anchor="middle" fill="#EAE4FF" font-size="12" font-weight="650">人工确认</text>
    <rect x="352" y="171" width="70" height="50" rx="12" fill="#FFFFFF" fill-opacity="0.055" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="387" y="201" text-anchor="middle" fill="#D8DBE3" font-size="12">脚本</text>
    <rect x="580" y="171" width="82" height="50" rx="12" fill="#A3E635" fill-opacity="0.07" stroke="#A3E635" stroke-opacity="0.20"/>
    <text x="621" y="201" text-anchor="middle" fill="#DDF3BA" font-size="12">分镜</text>
  </g>
