<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-labelledby="title desc">
  <title id="title">Crop Guard Agent</title>
  <desc id="desc">Crop Guard 项目封面，展示确定性规则门禁和评测</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0C1311"/><stop offset="1" stop-color="#153326"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#65A30D" stop-opacity="0.24"/><stop offset="1" stop-color="#65A30D" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/></pattern>
  </defs>
  <rect width="720" height="280" rx="24" fill="url(#bg)"/>
  <rect width="720" height="280" rx="24" fill="url(#grid)"/>
  <circle cx="620" cy="30" r="230" fill="url(#glow)"/>
  <rect x="1" y="1" width="718" height="278" rx="23" fill="none" stroke="#FFFFFF" stroke-opacity="0.10"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="34" y="42" fill="#A7ACB9" font-size="12" font-weight="700" letter-spacing="2">02 / EVALUATION &amp; SAFETY</text>
    <text x="32" y="105" fill="#F5F8F3" font-size="43" font-weight="750" letter-spacing="-1">Crop Guard</text>
    <text x="34" y="137" fill="#C8EF8B" font-size="17" font-weight="550">规则门禁与离线评测</text>
    <text x="34" y="178" fill="#929B94" font-size="13">让可判定的结论不依赖模型猜测</text>
    <rect x="34" y="218" width="82" height="28" rx="14" fill="#A3E635" fill-opacity="0.09"/><text x="75" y="237" text-anchor="middle" fill="#DDF3BA" font-size="10" font-weight="700">40 TESTS</text>
    <rect x="126" y="218" width="76" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.05"/><text x="164" y="237" text-anchor="middle" fill="#B3BBB5" font-size="10" font-weight="700">HOLDOUT</text>
    <rect x="212" y="218" width="76" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.05"/><text x="250" y="237" text-anchor="middle" fill="#B3BBB5" font-size="10" font-weight="700">LIVE DEMO</text>
  </g>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="390" y="48" width="274" height="180" rx="20" fill="#FFFFFF" fill-opacity="0.045" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <text x="416" y="78" fill="#929B94" font-size="10" font-weight="700" letter-spacing="1.6">DETERMINISTIC RULE GATE</text>
    <path d="M425 124H470M544 124H590" stroke="#65746A" stroke-width="1.5"/>
    <rect x="416" y="99" width="70" height="50" rx="12" fill="#FFFFFF" fill-opacity="0.05"/>
    <text x="451" y="129" text-anchor="middle" fill="#D8DED9" font-size="12">模型建议</text>
    <rect x="486" y="91" width="58" height="66" rx="14" fill="#A3E635" fill-opacity="0.10" stroke="#A3E635" stroke-opacity="0.30"/>
    <path d="M503 123L512 132L529 112" fill="none" stroke="#C8EF8B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="590" y="99" width="48" height="50" rx="12" fill="#A3E635" fill-opacity="0.07"/>
    <text x="614" y="129" text-anchor="middle" fill="#DDF3BA" font-size="11">结论</text>
    <path d="M416 192H638" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <rect x="424" y="174" width="18" height="18" rx="5" fill="#8B9DFF" opacity="0.42"/>
    <rect x="456" y="164" width="18" height="28" rx="5" fill="#8B9DFF" opacity="0.55"/>
    <rect x="488" y="153" width="18" height="39" rx="5" fill="#A3E635" opacity="0.72"/>
    <text x="532" y="179" fill="#929B94" font-size="10">DEV / HOLDOUT</text>
    <text x="532" y="198" fill="#DDF3BA" font-size="12" font-weight="650">可复现 · 可审计</text>
  </g>
</svg>
